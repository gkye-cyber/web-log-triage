[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WebCoreTrace"
version = "1.0.0"
description = "Dual-Mode Web Log & Runtime Memory Forensic Threat Hunter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich"
]

[project.scripts]
web-core-trace = "web_core_trace.cli:main_pipeline"
web-log-triage = "web_core_trace.cli:main_pipeline"

[tool.setuptools.packages.find]
where = ["src"]