[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-log-triage"
version = "0.1.0"
description = "Automated Web Server Access Log Threat Hunter & Forensic Triage Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich"
]

[project.scripts]
web-log-triage = "web_log_triage.cli:main_pipeline"

[tool.setuptools.packages.find]
where = ["src"]